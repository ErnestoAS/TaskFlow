# TaskFlow en https://sistemas.reduaz.mx/taskflow/  (docs/operacion.md, «nginx del servidor»).
#
# Se copia a /etc/nginx/snippets/taskflow.conf y se incluye con UNA línea dentro del bloque
# `server` que escucha en 443 en /etc/nginx/sites-available/gestioneducativa:
#
#     include /etc/nginx/snippets/taskflow.conf;
#
# Ese archivo es de actividades-uaz: siempre `sudo nginx -t` antes de `systemctl reload nginx`.

# Sin la diagonal final, mandar a la ruta con diagonal (si no, caería en actividades-uaz).
location = /taskflow {
    return 301 /taskflow/;
}

location /taskflow/ {
    # La diagonal final de proxy_pass quita el prefijo: Django recibe /django-admin/ y lo vuelve
    # a anteponer en las URLs que genera (DJANGO_FORCE_SCRIPT_NAME=/taskflow).
    proxy_pass http://127.0.0.1:8082/;
    proxy_set_header Host $host;
    # Un solo proxy: $remote_addr, no $proxy_add_x_forwarded_for (no se puede falsificar).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 10m;
}
