# TaskFlow en https://taskflow.rourendev.com/  (docs/operacion.md, «Publicarlo en nginx»).
#
# Sitio propio del nginx del servidor:
#   sudo install -m 644 taskflow.conf /etc/nginx/sites-available/taskflow
#   sudo ln -s /etc/nginx/sites-available/taskflow /etc/nginx/sites-enabled/taskflow
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d taskflow.rourendev.com --redirect
#
# certbot agrega en el archivo instalado el bloque de 443 (certificado) y la redirección de HTTP a
# HTTPS: este archivo es solo el punto de partida. Si se reinstala, volver a ejecutar certbot.
# El puerto 8082 está apartado en /opt/PUERTOS.md del servidor.

server {
    listen 80;
    listen [::]:80;
    server_name taskflow.rourendev.com;

    client_max_body_size 10m;

    location / {
        # Sin diagonal final: con dominio propio no hay prefijo que quitar.
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        # Un solo proxy: $remote_addr, no $proxy_add_x_forwarded_for (no se puede falsificar).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
