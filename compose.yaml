# Entorno de DESARROLLO.  Uso: docker compose up
name: taskflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${TASKFLOW_DB_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      DJANGO_MIGRATE: "1"
    volumes:
      # El entorno virtual vive en /opt/venv dentro de la imagen.
      - .:/app
    ports:
      - "${TASKFLOW_WEB_PORT:-8030}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
