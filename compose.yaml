# Entorno de DESARROLLO.  Uso: docker compose up
name: taskflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${TASKFLOW_DB_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      DJANGO_MIGRATE: "1"
    volumes:
      # El entorno virtual vive en /opt/venv dentro de la imagen.
      - .:/app
    ports:
      - "${TASKFLOW_WEB_PORT:-8030}:8000"
    depends_on:
      db:
        condition: service_healthy

  # PWA (frontend/). Compilar una vez:   docker compose run --rm frontend sh -c "npm ci && npm run build"
  #   (`run` no ejecuta el `command`; sin `npm ci` el volumen de node_modules queda vacío)
  # Desarrollo con recarga en caliente:  docker compose --profile frontend up
  #   → http://localhost:5173/app/  (Vite reenvía /api a Django)
  frontend:
    image: node:24-alpine
    profiles: ["frontend"]
    working_dir: /src/frontend
    command: sh -c "npm install && npm run dev -- --base /app/"
    environment:
      DJANGO_URL: http://web:8000
    volumes:
      - .:/src
      - frontend-node-modules:/src/frontend/node_modules
    ports:
      - "127.0.0.1:${TASKFLOW_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - web

volumes:
  db-data:
  frontend-node-modules:
