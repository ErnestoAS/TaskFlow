<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow · maqueta de la app (v3, listas)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Maqueta v3 de la PWA de TaskFlow (2026-10-02): listas libres por proyecto
   (estilo Trello) en lugar de los tres estatus fijos. POR APROBAR.
   Colores: los de static/css/tema.css (navy + petróleo), solo por variable.
========================================================= */
:root{
  /* Marca */
  --tf-logo:#000955;
  --tf-primary:#172554; --tf-primary-hover:#1e3a8a; --tf-primary-soft:#e8ecf6;
  --tf-accent:#0e7490; --tf-accent-hover:#155e75; --tf-accent-soft:#ecfeff;
  --tf-accent-text:#155e75; --tf-on-accent:#ffffff; --tf-accent-on-dark:#67e8f9;
  --tf-btn:#172554; --tf-btn-hover:#1e3a8a; --tf-on-btn:#ffffff;

  /* Fondos, texto y bordes */
  --tf-bg:#f5f7fa; --tf-surface:#ffffff; --tf-text:#172033; --tf-text-muted:#64748b;
  --tf-text-disabled:#94a3b8; --tf-border:#e2e8f0; --tf-sidebar-text:#cbd5e1;

  /* Semánticos */
  --tf-danger:#dc2626;  --tf-danger-text:#b91c1c;  --tf-danger-soft:#fef2f2;
  --tf-warning:#d97706; --tf-warning-text:#b45309; --tf-warning-soft:#fffbeb;

  /* Prioridades */
  --tf-priority-low:#cbd5e1;    --tf-priority-low-text:#64748b;    --tf-priority-low-soft:#f8fafc;
  --tf-priority-medium:#64748b; --tf-priority-medium-text:#334155; --tf-priority-medium-soft:#e2e8f0;
  --tf-priority-high:#d97706;   --tf-priority-high-text:#b45309;   --tf-priority-high-soft:#fffbeb;
  --tf-priority-urgent:#dc2626; --tf-priority-urgent-text:#b91c1c; --tf-priority-urgent-soft:#fef2f2;

  --av1:#172554; --av2:#1e3a8a; --av3:#334155; --av4:#475569; --av5:#0f3f6e; --av6:#3b4a6b;

  --tf-radius-card:12px; --tf-radius-btn:9px; --tf-radius-modal:16px;
  --tf-shadow:0 1px 3px rgba(15,23,42,.06);
  --tf-shadow-float:0 8px 24px rgba(15,23,42,.10);
  --tf-veil:rgba(15,23,42,.45);

  /* Escaparate (no es parte de la app) */
  --esc-fondo:#e7eaf0; --esc-texto:#33404d; --esc-caja:#ffffff; --esc-linea:#d5d8de;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--esc-fondo);color:var(--tf-text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--tf-accent);outline-offset:2px}

/* ---------- escaparate (solo para presentar) ---------- */
.escaparate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12.5px;color:var(--esc-texto)}
.escaparate .grupo{display:flex;align-items:center;gap:4px;background:var(--esc-caja);border:1px solid var(--esc-linea);border-radius:10px;padding:4px 6px}
.escaparate .grupo b{font-weight:600;padding:0 4px}
.escaparate button{border:0;background:transparent;padding:4px 9px;border-radius:7px}
.escaparate button[aria-pressed="true"]{background:var(--tf-primary);color:var(--tf-surface)}
.escaparate input[type=date]{border:0;background:transparent;padding:2px 4px}
.escaparate .nota{opacity:.75}

/* ---------- marco ---------- */
.dispositivo{
  width:390px;height:800px;background:var(--tf-bg);border-radius:38px;overflow:hidden;position:relative;
  box-shadow:0 0 0 10px var(--tf-text),0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;
}
.dispositivo.computadora{width:min(1240px,100%);height:760px;border-radius:14px;box-shadow:0 0 0 1px var(--esc-linea),0 24px 60px rgba(0,0,0,.18);
  display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr}
.computadora .cuerpo{display:contents}
.computadora .nav-lateral{grid-column:1;grid-row:1 / 3}
.computadora .cabecera{grid-column:2;grid-row:1}
.computadora .contenido{grid-column:2;grid-row:2;min-width:0}
@media (max-width:520px){
  body{padding:0;background:var(--tf-bg)}
  .escaparate{display:none}
  .dispositivo,.dispositivo.computadora{width:100%;height:100vh;border-radius:0;box-shadow:none}
}

/* ---------- cabecera ---------- */
.cabecera{background:var(--tf-surface);color:var(--tf-text);border-bottom:1px solid var(--tf-border);padding:14px 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.computadora .cabecera{padding:14px 24px}
.cabecera .titulos{flex:1;min-width:0}
.cabecera h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cabecera .sub{font-size:12px;color:var(--tf-text-muted);margin-top:1px}
.btn-icono{border:0;background:transparent;color:var(--tf-primary);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.btn-icono:hover{background:var(--tf-bg)}
.sello{width:34px;height:34px;display:grid;place-items:center;color:var(--tf-logo)}
.sello svg{width:32px;height:auto}
.computadora .sello{display:none}

/* ---------- contenido ---------- */
.contenido{flex:1;overflow:auto;padding:14px 14px 90px}
.computadora .contenido{padding:20px 24px 24px}
.seccion-titulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tf-text-muted);margin:18px 4px 8px;font-weight:600}
.seccion-titulo:first-child{margin-top:4px}
.vacio{color:var(--tf-text-muted);text-align:center;padding:36px 16px;font-size:14px}

/* ---------- proyectos ---------- */
.lista-proyectos{display:grid;gap:10px}
.computadora .lista-proyectos{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.proyecto{background:var(--tf-surface);border-radius:var(--tf-radius-card);border:1px solid var(--tf-border);box-shadow:var(--tf-shadow);padding:14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;transition:border-color .12s,box-shadow .12s}
.proyecto:hover{border-color:color-mix(in srgb,var(--tf-primary) 30%,var(--tf-border));box-shadow:var(--tf-shadow-float)}
.proyecto .fila{display:flex;align-items:center;gap:8px}
.proyecto h3{margin:0;font-size:15.5px;flex:1;font-weight:650}
/* Resumen de una sola línea: no crece con el número de listas. */
.proyecto .resumen{font-size:12.5px;color:var(--tf-text-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proyecto .resumen b{color:var(--tf-text);font-weight:600}
.proyecto .fila .chip{margin-left:auto}
.etiqueta-rol{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--tf-primary-soft);color:var(--tf-primary);font-weight:600}
.proyecto.archivado{opacity:.75}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:9999px;white-space:nowrap;line-height:1.3}
.punto{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
/* NUEVO v3: nombre de una lista. Neutro: las listas no tienen color (las nombra el usuario). */
.chip.lista{background:var(--tf-primary-soft);color:var(--tf-primary);font-weight:600}
.chip.lista .num{opacity:.7;font-weight:500}
.chip.neutro{background:var(--tf-bg);color:var(--tf-text-muted);border:1px solid var(--tf-border)}
.chip.vencida{background:var(--tf-danger-soft);color:var(--tf-danger-text)}
.chip.por-vencer{background:var(--tf-warning-soft);color:var(--tf-warning-text)}
.chip.fecha{background:var(--tf-bg);color:var(--tf-text-muted);font-weight:500}
.chip.prio-baja{background:var(--tf-priority-low-soft);color:var(--tf-priority-low-text)} .chip.prio-baja .punto{background:var(--tf-priority-low)}
.chip.prio-media{background:var(--tf-priority-medium-soft);color:var(--tf-priority-medium-text)} .chip.prio-media .punto{background:var(--tf-priority-medium)}
.chip.prio-alta{background:var(--tf-priority-high-soft);color:var(--tf-priority-high-text)} .chip.prio-alta .punto{background:var(--tf-priority-high)}
.chip.prio-urgente{background:var(--tf-priority-urgent-soft);color:var(--tf-priority-urgent-text)} .chip.prio-urgente .punto{background:var(--tf-priority-urgent)}
.chip.tipo{background:color-mix(in srgb,var(--tipo) 12%,var(--tf-surface));color:color-mix(in srgb,var(--tipo) 70%,var(--tf-text))}
.chip.tipo .punto{background:var(--tipo)}

/* ---------- avatares ---------- */
.avatares{display:flex}
.avatar{width:26px;height:26px;border-radius:50%;color:var(--tf-surface);font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--tf-surface);margin-left:-7px;letter-spacing:.02em}
.avatares .avatar:first-child{margin-left:0}
.avatar.grande{width:36px;height:36px;font-size:12.5px;margin:0;border:0}
.avatar.mas{background:var(--tf-border);color:var(--tf-text-muted)}

/* ---------- tablero de listas (NUEVO v3) ---------- */
.filtros{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:13px;color:var(--tf-text-muted);gap:8px}
.interruptor{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--tf-text-muted);padding:4px}
.interruptor .pista{width:32px;height:18px;border-radius:99px;background:var(--tf-border);position:relative;transition:.15s}
.interruptor .pista::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tf-surface);transition:.15s;box-shadow:var(--tf-shadow)}
.interruptor[aria-pressed="true"] .pista{background:var(--tf-accent)}
.interruptor[aria-pressed="true"] .pista::after{left:16px}
.filtro-tipos{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.filtro-tipos button{border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--tf-text-muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.filtro-tipos button .punto{background:var(--tipo,var(--tf-text-muted))}
.filtro-tipos button[aria-pressed="true"]{border-color:var(--tipo,var(--tf-primary));background:color-mix(in srgb,var(--tipo,var(--tf-primary)) 10%,var(--tf-surface));color:var(--tf-text)}
/* Teléfono: pestañas subrayadas con las listas (también se recorren deslizando) y un solo botón
   «Filtrar» que abre una hoja; en computadora los filtros quedan a la vista. */
.solo-compu{display:none}
.computadora .solo-compu{display:flex}
.computadora .solo-tel{display:none}
.pestanas-listas{display:flex;overflow-x:auto;margin:-14px -14px 12px;padding:0 8px;background:var(--tf-surface);border-bottom:1px solid var(--tf-border);scrollbar-width:none;position:sticky;top:-14px;z-index:3}
.pestanas-listas::-webkit-scrollbar{display:none}
.pestanas-listas button{border:0;background:transparent;padding:11px 10px 10px;font-size:13.5px;font-weight:600;color:var(--tf-text-muted);white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.pestanas-listas button[aria-current="true"]{color:var(--tf-primary);border-bottom-color:var(--tf-accent)}
.pestanas-listas .num{font-size:11px;font-weight:600;background:var(--tf-bg);color:var(--tf-text-muted);border-radius:99px;padding:1px 7px}
.barra-tel{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:13px;color:var(--tf-text-muted)}
.barra-tel .activos{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-tel .btn-link{border:0;background:transparent;color:var(--tf-accent-text);font-weight:600;font-size:13px;padding:4px}
.contador{background:var(--tf-primary);color:var(--tf-on-btn);border-radius:99px;font-size:11px;padding:0 6px;line-height:17px}
.opciones-filtro{display:flex;flex-direction:column;gap:2px}
.opciones-filtro label{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;font-size:14px}
.opciones-filtro label:hover{background:var(--tf-bg)}
.opciones-filtro input{width:18px;height:18px;accent-color:var(--tf-accent)}

.tablero{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 12px;scroll-padding:0 14px}
.computadora .tablero{margin:0;padding:0 0 12px;scroll-snap-type:none}
.lista{flex:0 0 86%;scroll-snap-align:start;background:color-mix(in srgb,var(--tf-border) 55%,var(--tf-bg));border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.computadora .lista{flex-basis:284px}
.lista-cab{display:flex;align-items:center;gap:6px;padding:2px 2px 2px 6px}
.lista-cab h3{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-cab .num{color:var(--tf-text-muted);font-weight:600;font-size:12px;background:var(--tf-surface);border-radius:99px;padding:1px 8px}
.lista-cab .btn-icono{width:30px;height:30px;color:var(--tf-text-muted)}
.lista-tarjetas{display:flex;flex-direction:column;gap:8px;min-height:8px}
.lista-tarjetas .vacio{padding:14px 8px;font-size:13px}
.agregar-tarjeta{border:0;background:transparent;color:var(--tf-text-muted);font-weight:600;font-size:13.5px;text-align:left;padding:8px 8px;border-radius:9px;display:flex;align-items:center;gap:6px}
.agregar-tarjeta:hover{background:color-mix(in srgb,var(--tf-text) 6%,transparent);color:var(--tf-text)}
.lista.nueva{background:transparent;border:2px dashed var(--tf-border)}
.lista.nueva form{display:flex;flex-direction:column;gap:8px}
.lista.nueva input{border:1px solid var(--tf-border);border-radius:var(--tf-radius-btn);padding:9px 11px;background:var(--tf-surface)}
.lista.nueva input:focus{outline:none;border-color:var(--tf-accent);box-shadow:0 0 0 3px var(--tf-accent-soft)}
/* Arrastrar y soltar. Computadora: arrastre nativo. Teléfono: mantener presionada ~0.35 s; la
   tarjeta se levanta y sigue al dedo, y cerca del borde el tablero se desplaza a la otra lista. */
.tarjeta[draggable="true"]{cursor:grab}
.tablero.tactil .tarjeta{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tarjeta.presionando{transform:scale(.98);transition:transform .35s}
.tarjeta.hueco{opacity:.35;box-shadow:none;border-style:dashed}
.fantasma{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(2.5deg) scale(1.04);box-shadow:0 18px 40px rgba(15,23,42,.28);border-color:var(--tf-accent);transition:none;animation:levantar .15s ease-out}
.tablero.arrastrando-tactil{scroll-snap-type:none}
@keyframes levantar{from{transform:none;box-shadow:var(--tf-shadow)}to{transform:rotate(2.5deg) scale(1.04)}}
.tarjeta.arrastrando{opacity:.35}
.lista.destino{box-shadow:inset 0 0 0 2px var(--tf-accent)}
.marcador{height:3px;border-radius:3px;background:var(--tf-accent);margin:-2px 4px}

.tarjeta{position:relative;background:var(--tf-surface);border-radius:var(--tf-radius-card);border:1px solid var(--tf-border);box-shadow:var(--tf-shadow);padding:11px 12px;text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.tarjeta:hover{border-color:color-mix(in srgb,var(--tf-primary) 28%,var(--tf-border));box-shadow:var(--tf-shadow-float)}
.tarjeta.urgente::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tf-priority-urgent)}
.tarjeta h4{margin:0;font-size:14px;font-weight:650;line-height:1.3}
.tarjeta p{margin:0;font-size:12.5px;color:var(--tf-text-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarjeta .etiquetas{display:flex;gap:5px;flex-wrap:wrap}
.tarjeta .pie{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tarjeta .pie .avatares{margin-left:auto}
.tarjeta .proyecto-de{font-size:11.5px;color:var(--tf-primary);font-weight:600}
.mis-tarjetas{display:grid;gap:10px}
.computadora .mis-tarjetas{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* ---------- botones ---------- */
.btn{border:0;border-radius:var(--tf-radius-btn);padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,box-shadow .12s}
.btn-primario{background:var(--tf-btn);color:var(--tf-on-btn)}
.btn-primario:hover{background:var(--tf-btn-hover)}
.btn-secundario{background:var(--tf-surface);color:var(--tf-text);box-shadow:inset 0 0 0 1px var(--tf-border)}
.btn-secundario:hover{background:var(--tf-bg)}
.btn-peligro{background:var(--tf-surface);color:var(--tf-danger-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tf-danger) 45%,var(--tf-border))}
.btn-peligro:hover{background:var(--tf-danger-soft)}
.btn-peligro-lleno{background:var(--tf-danger-text);color:var(--tf-surface)}
.btn-chico{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-bloque{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acciones-cab{display:none;gap:8px}
.computadora .acciones-cab{display:flex}

/* ---------- navegación ---------- */
.nav-inferior{position:absolute;left:0;right:0;bottom:0;background:var(--tf-surface);border-top:1px solid var(--tf-border);display:flex;justify-content:space-around;padding:6px 6px 14px;z-index:5}
.nav-inferior button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tf-text-muted);padding:6px 12px;border-radius:10px;min-width:84px}
.nav-inferior button[aria-current="page"]{color:var(--tf-primary);font-weight:650}
.nav-inferior button[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--tf-accent);transform:translateX(-50%)}
.nav-lateral{display:none}
.computadora .nav-inferior{display:none}
.cuerpo{display:flex;flex-direction:column;flex:1;min-height:0}
.computadora .nav-lateral{display:flex;flex-direction:column;gap:2px;background:var(--tf-primary);padding:18px 12px}
.marca-lateral{display:flex;align-items:center;gap:10px;color:var(--tf-surface);padding:2px 8px 18px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.marca-lateral svg{width:30px;height:auto}
.nav-lateral .separador{height:1px;background:color-mix(in srgb,var(--tf-surface) 12%,transparent);margin:10px 8px}
.nav-lateral .rotulo-nav{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tf-sidebar-text);opacity:.7;padding:4px 12px}
.nav-lateral button{position:relative;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--tf-sidebar-text);text-align:left}
.nav-lateral button:hover{background:color-mix(in srgb,var(--tf-surface) 6%,transparent);color:var(--tf-surface)}
.nav-lateral button[aria-current="page"]{background:color-mix(in srgb,var(--tf-accent-on-dark) 14%,transparent);color:var(--tf-surface);font-weight:600}
.nav-lateral button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--tf-accent-on-dark)}

/* ---------- hoja (detalle / formularios) ---------- */
.velo{position:absolute;inset:0;background:var(--tf-veil);display:flex;align-items:flex-end;z-index:10;animation:aparecer .15s}
.computadora .velo{align-items:stretch;justify-content:flex-end}
.hoja{background:var(--tf-surface);width:100%;max-height:92%;border-radius:var(--tf-radius-modal) var(--tf-radius-modal) 0 0;overflow:auto;padding:8px 18px 22px;animation:subir .18s ease-out}
.computadora .hoja{width:460px;max-height:none;border-radius:0;padding:22px 26px;animation:entrar .18s ease-out}
.asa{width:40px;height:5px;border-radius:9px;background:var(--tf-border);margin:4px auto 12px}
.computadora .asa{display:none}
.hoja-cab{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.hoja-cab h2{font-size:18px;margin:0;flex:1;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.hoja-cab .btn-icono{color:var(--tf-text-muted)}
.campo{margin-bottom:16px}
.campo>label,.campo>.etiqueta{display:block;font-size:11.5px;font-weight:600;color:var(--tf-text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.campo input[type=text],.campo input[type=email],.campo input[type=date],.campo textarea,.campo select{width:100%;border:1px solid var(--tf-border);border-radius:var(--tf-radius-btn);padding:10px 12px;background:var(--tf-surface);font-size:14.5px}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:none;border-color:var(--tf-accent);box-shadow:0 0 0 3px var(--tf-accent-soft)}
.campo textarea{min-height:96px;resize:vertical}
.campo .ayuda,.ayuda{font-size:12px;color:var(--tf-text-muted);margin-top:5px}
.campo .error{font-size:12px;color:var(--tf-danger-text);margin-top:5px}
.texto-largo{font-size:14.5px;line-height:1.55;white-space:pre-wrap;margin:0}
/* Dos campos lado a lado (fecha de inicio y fecha límite). */
.dos-campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.elegir-lista{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.elegir-lista::-webkit-scrollbar{display:none}
.elegir-lista button{border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--tf-text-muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .12s,border-color .12s}
.elegir-lista button:hover{border-color:color-mix(in srgb,var(--tf-primary) 35%,var(--tf-border))}
.elegir-lista button[aria-checked="true"]{background:var(--tf-primary-soft);border-color:var(--tf-primary);color:var(--tf-primary);cursor:default}
.elegir-prioridad{display:flex;gap:6px}
.elegir-prioridad label{flex:1;cursor:pointer}
.elegir-prioridad input{position:absolute;opacity:0;pointer-events:none}
.elegir-prioridad .chip{width:100%;justify-content:center;padding:8px 4px;font-size:12.5px;border:1px solid var(--tf-border);background:var(--tf-surface);color:var(--tf-text-muted)}
.elegir-prioridad input:checked + .chip.prio-baja{background:var(--tf-priority-low-soft);color:var(--tf-priority-low-text);border-color:var(--tf-priority-low)}
.elegir-prioridad input:checked + .chip.prio-media{background:var(--tf-priority-medium-soft);color:var(--tf-priority-medium-text);border-color:var(--tf-priority-medium)}
.elegir-prioridad input:checked + .chip.prio-alta{background:var(--tf-priority-high-soft);color:var(--tf-priority-high-text);border-color:var(--tf-priority-high)}
.elegir-prioridad input:checked + .chip.prio-urgente{background:var(--tf-priority-urgent-soft);color:var(--tf-priority-urgent-text);border-color:var(--tf-priority-urgent)}
.personas{display:flex;flex-direction:column;gap:6px}
.persona{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px;flex-wrap:wrap}
.persona .nombre{flex:1;font-size:14px}
.persona .nombre small{display:block;color:var(--tf-text-muted);font-size:12px}
.persona input[type=checkbox]{width:18px;height:18px;accent-color:var(--tf-accent)}
label.persona{cursor:pointer}
label.persona:hover{background:var(--tf-bg)}
.tipos-tarjeta,.elegir-tipos{display:flex;gap:6px;flex-wrap:wrap}
.elegir-tipos label{cursor:pointer}
.elegir-tipos input{position:absolute;opacity:0;pointer-events:none}
.elegir-tipos .chip{border:1px solid transparent;padding:6px 12px;font-size:13px;opacity:.5}
.elegir-tipos input:checked + .chip{opacity:1;border-color:var(--tipo)}
.historial{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.historial li{position:relative;padding:0 0 14px 22px;font-size:13.5px;line-height:1.6}
.historial li::before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--tf-surface);border:2px solid var(--tf-text-muted)}
.historial li::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--tf-border)}
.historial li:first-child::before{border-color:var(--tf-accent)}
.historial li:last-child{padding-bottom:0}
.historial li:last-child::after{display:none}
.historial .cuando{display:block;font-size:12px;color:var(--tf-text-muted)}
.historial .chip{font-size:11px;padding:1px 8px}
.meta{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tf-text-muted);border-top:1px solid var(--tf-border);padding-top:12px;margin-top:6px}
.fila-botones{display:flex;gap:8px;margin-top:8px}
.fila-botones .btn{flex:1}

.tarjeta-blanca{background:var(--tf-surface);border-radius:var(--tf-radius-card);border:1px solid var(--tf-border);box-shadow:var(--tf-shadow);padding:6px 12px}
.tarjeta-blanca .persona{padding:10px 0;border-bottom:1px solid var(--tf-border);border-radius:0}
.tarjeta-blanca .persona:last-child{border-bottom:0}
.acciones-persona{display:flex;gap:6px;align-items:center}
.permisos{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-left:46px}
.permisos button,.permisos span{border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--tf-text-muted);display:inline-flex;gap:5px;align-items:center}
.permisos button svg{display:none}
.permisos button[aria-pressed="true"],.permisos span.si{background:var(--tf-accent-soft);border-color:var(--tf-accent);color:var(--tf-primary)}
.permisos button[aria-pressed="true"] svg,.permisos span.si svg{display:inline;color:var(--tf-accent-text)}
.permisos .rotulo{border:0;padding:4px 0;background:transparent;font-weight:500}
.permisos .nuevo{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tf-accent-text)}
.banner{display:flex;gap:10px;align-items:center;background:var(--tf-primary-soft);color:var(--tf-text);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner span{flex:1}
.aviso{font-size:13px;color:var(--tf-text-muted);background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}

/* ---------- confirmación y aviso ---------- */
.modal{position:absolute;inset:0;background:var(--tf-veil);display:grid;place-items:center;z-index:20;padding:24px;animation:aparecer .12s}
.modal .caja{background:var(--tf-surface);border-radius:var(--tf-radius-modal);padding:20px;max-width:340px;width:100%;box-shadow:var(--tf-shadow-float)}
.modal p{margin:0 0 16px;font-size:15px;line-height:1.45}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tf-primary);color:var(--tf-surface);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:30;box-shadow:var(--tf-shadow-float);white-space:nowrap;animation:aparecer .15s}
.computadora .toast{bottom:24px}

@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes entrar{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

};
const PRIORIDADES = [['baja','Baja'],['media','Media'],['alta','Alta'],['urgente','Urgente']];
const PERMISOS = [['crear','Crear'],['editar','Editar'],['mover','Mover'],['eliminar','Eliminar'],['listas','Gestionar listas'],['tipos','Gestionar tipos']];
const LISTAS_INICIALES = ['Pendiente', 'En curso', 'Finalizada'];

/* ---------------------------------------------------------------------------
   Utilidades
--------------------------------------------------------------------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const iniciales = id => usuarios[id].nombre.split(' ').map(p => p[0]).slice(0,2).join('');
const avatar = (id, grande) => `<span class="avatar${grande ? ' grande' : ''}" style="background:var(${usuarios[id].color})" title="${esc(usuarios[id].nombre)}">${iniciales(id)}</span>`;
function avatares(ids, max = 3){
  const extra = ids.length - max;
  return `<span class="avatares">${ids.slice(0, max).map(i => avatar(i)).join('')}${extra > 0 ? `<span class="avatar mas">+${extra}</span>` : ''}</span>`;
}
const fechaDe = dias => { if (dias === null) return null; const d = new Date(estado.hoy); d.setDate(d.getDate() + dias); return d; };
const diasEntre = d => Math.round((new Date(d.toDateString()) - new Date(estado.hoy.toDateString())) / 864e5);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const corta = d => `${d.getDate()} ${MESES[d.getMonth()]}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fechaLarga = d => `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
const fechaHora = d => `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

// Sin estatus no hay «terminada»: una fecha pasada siempre es «Vencida», esté en la lista que esté.
function chipFecha(t){
  if (!t.fecha) return '';
  const dif = diasEntre(t.fecha);
  if (dif < 0) return `<span class="chip vencida">${I.alerta} Vencida · ${corta(t.fecha)}</span>`;
  if (dif === 0) return `<span class="chip por-vencer">${I.calendario} Vence hoy</span>`;
  if (dif === 1) return `<span class="chip por-vencer">${I.calendario} Vence mañana</span>`;
  return `<span class="chip fecha">${I.calendario} ${corta(t.fecha)}</span>`;
}
const esVencida = t => t.fecha && diasEntre(t.fecha) < 0;
const proyectoDe = id => proyectos.find(p => p.id === id);
const listaDe = (p, id) => p.listas.find(l => l.id === id);
const misProyectos = () => proyectos.filter(p => p.miembros.includes(estado.yo));
const tipoDe = (p, id) => p.tipos.find(x => x.id === id);
const chipTipo = tp => `<span class="chip tipo" style="--tipo:${tp.color}"><span class="punto"></span>${esc(tp.nombre)}</span>`;
const chipLista = nombre => `<span class="chip lista">${esc(nombre)}</span>`;
const chipPrioridad = p => `<span class="chip prio-${p}"><span class="punto"></span>${PRIORIDADES.find(x => x[0] === p)[1]}</span>`;
const puede = (p, accion) => !p.archivado && (p.dueno === estado.yo || !!(p.permisos[estado.yo] || {})[accion]);
const deLista = id => tarjetas.filter(t => t.lista === id).sort((a, b) => a.pos - b.pos);

/* Mueve una tarjeta a `listaId` en la posición `indice` y renumera las dos listas (como hará el servicio). */
function mover(t, listaId, indice){
  const p = proyectoDe(t.proyecto);
  const origen = t.lista;
  const destino = deLista(listaId).filter(x => x !== t);
  destino.splice(Math.max(0, Math.min(indice, destino.length)), 0, t);
  destino.forEach((x, i) => x.pos = i);
  t.lista = listaId;
  if (origen !== listaId){
    deLista(origen).forEach((x, i) => x.pos = i);
    t.historial.push({cuando:ahora(), quien:estado.yo, de:listaDe(p, origen).nombre, a:listaDe(p, listaId).nombre});
    toast(`Se movió a «${listaDe(p, listaId).nombre}».`);
  }
}

function toast(texto){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role','status'); el.textContent = texto;
  $('#dispositivo').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

tarjetas.forEach(t => { t.fecha = fechaDe(t.fin); });

/* Historial de movimientos: guarda el NOMBRE de las listas (si después se renombra o se elimina
   una lista, el historial sigue diciendo lo que pasó). La creación es la primera entrada. */
function momento(dias, hora, minuto){ const d = fechaDe(dias); d.setHours(hora, minuto, 0, 0); return d; }
tarjetas.forEach(t => {
  const p = proyectoDe(t.proyecto);
  const actual = listaDe(p, t.lista).nombre, primera = p.listas[0].nombre;
  t.historial = [{cuando:momento(-12, 9, 14), quien:t.creada_por, de:null, a:primera}];
  // creada = fecha y hora en que se capturó (automática); inicio = fecha de inicio, editable.
  // Por omisión son el mismo día; en las tarjetas 1 y 15 se capturó días después del inicio.
  t.creada = t.historial[0].cuando;
  t.inicio = fechaDe(t.ini !== undefined ? t.ini : -12);
  if (actual !== primera) t.historial.push({cuando:momento(-6, 11, 32), quien:t.asignados[0] || t.creada_por, de:primera, a:actual});
});
function ahora(){ const d = new Date(estado.hoy), r = new Date(); d.setHours(r.getHours(), r.getMinutes(), 0, 0); return d; }

   Eventos
--------------------------------------------------------------------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vista],[data-yo],[data-ir],[data-proyecto],[data-tarjeta],[data-permiso],[data-filtro-tipo],[data-saltar],[data-mover-a],[data-menu-lista],[data-nueva-en],[data-accion]');
  if (!b) return;
  if (b.dataset.vista){ estado.vista = b.dataset.vista; marcar('[data-vista]', b); return render(); }
  if (b.dataset.yo){
    estado.yo = b.dataset.yo; marcar('[data-yo]', b);
    if (estado.proyecto && !proyectoDe(estado.proyecto).miembros.includes(estado.yo)) estado.pantalla = 'proyectos';
    estado.capa = null; return render();
  }
  if (b.dataset.ir){ estado.pantalla = b.dataset.ir; estado.capa = null; return render(); }
  if (b.dataset.proyecto){ Object.assign(estado, {proyecto:+b.dataset.proyecto, pantalla:'tablero', soloMias:false, filtroTipo:null, agregandoLista:false}); return render(); }
  if (b.dataset.tarjeta){ estado.capa = {tipo:'detalle', id:+b.dataset.tarjeta}; return render(); }
  if (b.dataset.filtroTipo !== undefined){ estado.filtroTipo = +b.dataset.filtroTipo || null; return render(); }
  if (b.dataset.saltar){
    document.querySelector(`.lista[data-lista="${b.dataset.saltar}"]`).scrollIntoView({behavior:'smooth', inline:'start', block:'nearest'});
    marcarSalto(b.dataset.saltar); return;
  }
  if (b.dataset.moverA){
    const t = tarjetas.find(x => x.id === estado.capa.id), destino = +b.dataset.moverA;
    if (destino !== t.lista) mover(t, destino, deLista(destino).length);
    return render();
  }
  if (b.dataset.menuLista){ estado.capa = {tipo:'lista', id:+b.dataset.menuLista}; return render(); }
  if (b.dataset.nuevaEn){ estado.capa = {tipo:'nueva', lista:+b.dataset.nuevaEn}; return render(); }
  if (b.dataset.permiso){
    const [u, k] = b.dataset.permiso.split(':'); const p = proyectoDe(estado.proyecto);
    p.permisos[u] = p.permisos[u] || {}; p.permisos[u][k] = !p.permisos[u][k];
    toast(`Se actualizaron los permisos de ${usuarios[u].nombre}.`); return render();
  }
  const a = b.dataset.accion;
  if (a === 'cerrar-fondo' && e.target !== b) return;
  if (a === 'cerrar' || a === 'cerrar-fondo'){ estado.capa = null; return render(); }
  if (a === 'nuevo-proyecto'){ estado.capa = {tipo:'nuevo-proyecto'}; return render(); }
  if (a === 'editar'){ estado.capa = {tipo:'editar', id:estado.capa.id}; return render(); }
  if (a === 'solo-mias'){ estado.soloMias = !estado.soloMias; return render(); }
  if (a === 'filtros'){ estado.capa = {tipo:'filtros'}; return render(); }
  if (a === 'quitar-filtros'){ Object.assign(estado, {soloMias:false, filtroTipo:null, capa:null}); return render(); }
  if (a === 'agregar-lista'){ estado.agregandoLista = true; return render(); }
  if (a === 'cancelar-lista'){ estado.agregandoLista = false; return render(); }
  if (a === 'lista-izq' || a === 'lista-der'){
    const p = proyectoDe(estado.proyecto), l = listaDe(p, estado.capa.id), i = p.listas.indexOf(l), j = a === 'lista-izq' ? i - 1 : i + 1;
    p.listas.splice(i, 1); p.listas.splice(j, 0, l); toast('Se cambió el orden de las listas.'); return render();
  }
  if (a === 'eliminar-lista'){
    const p = proyectoDe(estado.proyecto), l = listaDe(p, estado.capa.id);
    estado.capa = {tipo:'confirmar', mensaje:`¿Eliminar la lista «${l.nombre}»? Está vacía; esta acción no se puede deshacer.`, boton:'Eliminar lista',
      hacer:() => { p.listas = p.listas.filter(x => x !== l); toast('Se eliminó la lista.'); }};
    return render();
  }
  if (a === 'eliminar-tarjeta'){
    const t = tarjetas.find(x => x.id === estado.capa.id);
    estado.capa = {tipo:'confirmar', mensaje:`¿Eliminar la tarjeta «${t.titulo}»? Esta acción no se puede deshacer.`, boton:'Eliminar',
      hacer:() => { const l = t.lista; tarjetas.splice(tarjetas.indexOf(t), 1); deLista(l).forEach((x, i) => x.pos = i); toast('Se eliminó la tarjeta.'); }};
    return render();
  }
  if (a === 'confirmar'){ const c = estado.capa; estado.capa = null; c.hacer(); return render(); }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const p = proyectoDe(estado.proyecto);
  if (f.id === 'form-filtros'){
    const tipo = f.querySelector('[name=fl-tipo]:checked');
    Object.assign(estado, {soloMias:$('#fl-mias').checked, filtroTipo:tipo ? +tipo.value || null : null, capa:null});
    return render();
  }
  if (f.id === 'form-tarjeta'){
    const titulo = $('#f-titulo').value.trim(), desc = $('#f-desc').value.trim();
    const inicio = $('#f-inicio').value, fin = $('#f-fecha').value;
    const finAntes = inicio && fin && fin < inicio;
    $('#e-titulo').hidden = !!titulo; $('#e-desc').hidden = !!desc; $('#e-inicio').hidden = !!inicio; $('#e-fecha').hidden = !finAntes;
    if (!titulo || !desc || !inicio || finAntes) return;
    const datos = {titulo, descripcion:desc, prioridad:f.querySelector('[name=prioridad]:checked').value,
      inicio:new Date(inicio + 'T12:00:00'),
      fecha:fin ? new Date(fin + 'T12:00:00') : null,
      asignados:[...f.querySelectorAll('[name=asig]:checked')].map(x => x.value),
      tipos:[...f.querySelectorAll('[name=tipo]:checked')].map(x => +x.value)};
    if (estado.capa.tipo === 'editar'){
      const t = tarjetas.find(x => x.id === estado.capa.id);
      Object.assign(t, datos); estado.capa = {tipo:'detalle', id:t.id}; toast('Se guardó la tarjeta.');
    } else {
      const lista = +$('#f-lista-t').value;
      tarjetas.push({id:sigId++, proyecto:p.id, lista, pos:deLista(lista).length, creada_por:estado.yo, creada:ahora(), ...datos,
        historial:[{cuando:ahora(), quien:estado.yo, de:null, a:listaDe(p, lista).nombre}]});
      estado.capa = null; toast('Se creó la tarjeta.');
    }
    return render();
  }
  if (f.id === 'form-lista-nueva' || f.id === 'form-lista'){
    const inp = f.id === 'form-lista' ? $('#f-lnombre') : $('#f-lista'), err = f.id === 'form-lista' ? $('#e-lnombre') : $('#e-lista');
    const nombre = inp.value.trim(), propia = f.id === 'form-lista' ? estado.capa.id : null;
    const repetido = p.listas.some(l => l.id !== propia && l.nombre.toLowerCase() === nombre.toLowerCase());
    err.textContent = !nombre ? 'Escribe un nombre.' : repetido ? 'Ya hay una lista con ese nombre en este espacio.' : '';
    err.hidden = !err.textContent; if (err.textContent) return;
    if (propia){ listaDe(p, propia).nombre = nombre; estado.capa = null; toast('Se renombró la lista.'); }
    else { p.listas.push({id:sigLista++, nombre}); estado.agregandoLista = false; toast('Se agregó la lista.'); }
    render();
    if (!propia) document.getElementById('tablero').scrollLeft = 1e6;
    return;
  }
  if (f.id === 'form-proyecto'){
    const nombre = $('#f-nombre').value.trim();
    $('#e-nombre').hidden = !!nombre; if (!nombre) return;
    const id = Math.max(...proyectos.map(x => x.id)) + 1;
    proyectos.push({id, nombre, dueno:estado.yo, miembros:[estado.yo], archivado:false, permisos:{}, tipos:[],
      listas:LISTAS_INICIALES.map(n => ({id:sigLista++, nombre:n}))});
    Object.assign(estado, {capa:null, proyecto:id, pantalla:'tablero'}); toast('Se creó el espacio.');
    return render();
  }
});

/* Arrastrar y soltar en computadora (en la app se usaría una librería con soporte táctil y de teclado). */
let arrastrada = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest('.tarjeta[draggable="true"]'); if (!el) return;
  arrastrada = tarjetas.find(t => t.id === +el.dataset.tarjeta);
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.tarjeta);
  requestAnimationFrame(() => el.classList.add('arrastrando'));
});
document.addEventListener('dragend', () => { arrastrada = null; limpiarDestino(); document.querySelectorAll('.arrastrando').forEach(x => x.classList.remove('arrastrando')); });
function limpiarDestino(){ document.querySelectorAll('.marcador').forEach(x => x.remove()); document.querySelectorAll('.lista.destino').forEach(x => x.classList.remove('destino')); }
function indiceSoltar(cont, y, excluir = '.arrastrando'){
  const hijos = [...cont.querySelectorAll(`.tarjeta:not(${excluir})`)];
  const i = hijos.findIndex(h => { const r = h.getBoundingClientRect(); return y < r.top + r.height / 2; });
  return {i: i === -1 ? hijos.length : i, hijos};
}
document.addEventListener('dragover', e => {
  const lista = e.target.closest('.lista[data-lista]'); if (!arrastrada || !lista) return;
  e.preventDefault();
  const cont = lista.querySelector('.lista-tarjetas');
  const {i, hijos} = indiceSoltar(cont, e.clientY);
  limpiarDestino(); lista.classList.add('destino');
  const m = document.createElement('div'); m.className = 'marcador';
  hijos[i] ? cont.insertBefore(m, hijos[i]) : cont.appendChild(m);
});
document.addEventListener('drop', e => {
  const lista = e.target.closest('.lista[data-lista]'); if (!arrastrada || !lista) return;
  e.preventDefault();
  const {i, hijos} = indiceSoltar(lista.querySelector('.lista-tarjetas'), e.clientY);
  // El índice es sobre las tarjetas visibles (con filtros); se traduce al de la lista completa.
  const destino = deLista(+lista.dataset.lista).filter(t => t !== arrastrada);
  const ref = hijos[i] ? tarjetas.find(t => t.id === +hijos[i].dataset.tarjeta) : null;
  mover(arrastrada, +lista.dataset.lista, ref ? destino.indexOf(ref) : destino.length);
  arrastrada = null; render();
});

/* Arrastrar en teléfono: mantener presionada para levantar la tarjeta. Si el dedo se mueve antes
   de tiempo es un desplazamiento normal y no se levanta nada. Pointer events, así que en la
   maqueta también funciona con el mouse en la vista «Teléfono». */
const ESPERA_MS = 350, TOLERANCIA_PX = 8, BORDE_PX = 48;
let tactil = null;   // {t, el, x0, y0, timer, fantasma, dx, dy, x, y, activo}
let ignorarClicHasta = 0;
document.addEventListener('click', e => { if (Date.now() < ignorarClicHasta){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.tablero.tactil .tarjeta'); if (!el || e.button > 0) return;
  tactil = {t:tarjetas.find(x => x.id === +el.dataset.tarjeta), el, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, activo:false};
  el.classList.add('presionando');
  tactil.timer = setTimeout(levantar, ESPERA_MS);
});
function levantar(){
  const {el, x, y} = tactil, r = el.getBoundingClientRect();
  const f = el.cloneNode(true);
  f.classList.remove('presionando'); f.classList.add('fantasma');
  Object.assign(f.style, {width:r.width + 'px', left:r.left + 'px', top:r.top + 'px'});
  document.body.appendChild(f);
  Object.assign(tactil, {activo:true, fantasma:f, dx:x - r.left, dy:y - r.top});
  el.classList.remove('presionando'); el.classList.add('hueco');
  $('#tablero').classList.add('arrastrando-tactil');
  if (navigator.vibrate) navigator.vibrate(15);
  autoDesplazar();
}
document.addEventListener('pointermove', e => {
  if (!tactil) return;
  tactil.x = e.clientX; tactil.y = e.clientY;
  if (!tactil.activo){
    if (Math.hypot(e.clientX - tactil.x0, e.clientY - tactil.y0) > TOLERANCIA_PX) cancelarTactil();
    return;
  }
  tactil.fantasma.style.left = (e.clientX - tactil.dx) + 'px';
  tactil.fantasma.style.top = (e.clientY - tactil.dy) + 'px';
  marcarDestinoTactil();
});
// Mientras se arrastra, el dedo no debe desplazar la página.
document.addEventListener('touchmove', e => { if (tactil && tactil.activo) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest('.tablero.tactil .tarjeta')) e.preventDefault(); });
function listaBajo(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest('.lista[data-lista]'); }
function marcarDestinoTactil(){
  limpiarDestino();
  const lista = listaBajo(tactil.x, tactil.y); if (!lista) return;
  const cont = lista.querySelector('.lista-tarjetas');
  const {i, hijos} = indiceSoltar(cont, tactil.y, '.hueco');
  lista.classList.add('destino');
  const m = document.createElement('div'); m.className = 'marcador';
  hijos[i] ? cont.insertBefore(m, hijos[i]) : cont.appendChild(m);
}
// Cerca de los bordes, el tablero se desplaza solo (a los lados) y el contenido (arriba y abajo).
function autoDesplazar(){
  if (!tactil || !tactil.activo) return;
  const tb = $('#tablero').getBoundingClientRect(), ct = $('#contenido').getBoundingClientRect();
  if (tactil.x < tb.left + BORDE_PX) $('#tablero').scrollLeft -= 9;
  else if (tactil.x > tb.right - BORDE_PX) $('#tablero').scrollLeft += 9;
  if (tactil.y < ct.top + BORDE_PX) $('#contenido').scrollTop -= 7;
  else if (tactil.y > ct.bottom - BORDE_PX - 70) $('#contenido').scrollTop += 7;
  marcarDestinoTactil();
  requestAnimationFrame(autoDesplazar);
}
document.addEventListener('pointerup', () => {
  if (!tactil) return;
  if (!tactil.activo) return cancelarTactil();
  const {t, x, y} = tactil;
  const lista = listaBajo(x, y);
  if (lista){
    const {i, hijos} = indiceSoltar(lista.querySelector('.lista-tarjetas'), y, '.hueco');
    const destino = deLista(+lista.dataset.lista).filter(z => z !== t);
    const ref = hijos[i] ? tarjetas.find(z => z.id === +hijos[i].dataset.tarjeta) : null;
    const antes = {lista:t.lista, pos:t.pos};
    mover(t, +lista.dataset.lista, ref ? destino.indexOf(ref) : destino.length);
    if (antes.lista === t.lista && antes.pos !== t.pos) toast('Se cambió el orden de la tarjeta.');
  }
  ignorarClicHasta = Date.now() + 400;   // soltar no debe abrir el detalle
  cancelarTactil(); render();
});
document.addEventListener('pointercancel', () => cancelarTactil());
function cancelarTactil(){
  if (!tactil) return;
  clearTimeout(tactil.timer);
  tactil.el.classList.remove('presionando', 'hueco');
  if (tactil.fantasma) tactil.fantasma.remove();
  const tb = $('#tablero'); if (tb) tb.classList.remove('arrastrando-tactil');
  limpiarDestino(); tactil = null;
}

/* Teléfono: marca en el salto rápido la lista que está a la vista al deslizar. */
document.addEventListener('scroll', e => {
  if (e.target.id !== 'tablero') return;
  const t = e.target, listas = [...t.querySelectorAll('.lista[data-lista]')];
  const actual = listas.find(l => l.offsetLeft + l.offsetWidth / 2 > t.scrollLeft) || listas[0];
  if (actual) marcarSalto(actual.dataset.lista);
}, true);
function marcarSalto(id){ document.querySelectorAll('[data-saltar]').forEach(x => x.setAttribute('aria-current', x.dataset.saltar === String(id))); }

$('#hoy').addEventListener('change', e => { if (e.target.value){ estado.hoy = new Date(e.target.value + 'T12:00:00'); render(); } });
function marcar(sel, b){ document.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', x === b)); }

render();
</script>
</body>
</html>
