<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow · maqueta de la app (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Maqueta v2 de la PWA de TaskFlow · paleta navy + coral (2026-10-01).
   Exploración: NO aprobada. Colores solo por variable (--tf-*), los mismos
   que irán en static/css/tema.css. Contraste verificado (WCAG AA ≥ 4.5).
========================================================= */
:root{
  /* Marca */
  --tf-logo:#000955;                 /* color propio del logo: no se cambia */
  --tf-primary:#172554;              /* navy: identidad, navegación, estructura */
  --tf-primary-hover:#1e3a8a;
  --tf-primary-soft:#e8ecf6;
  --tf-accent:#f97360;               /* coral: acción, progreso, seleccionado (no como texto) */
  --tf-accent-hover:#fb8a79;
  --tf-accent-soft:#fff0ed;
  --tf-accent-text:#c73e2e;          /* coral oscuro para texto sobre fondos claros (4.56) */
  --tf-on-accent:#172554;            /* texto sobre coral: navy (5.35); blanco daría 2.75 */

  /* Fondos, texto y bordes */
  --tf-bg:#f5f7fa;
  --tf-surface:#ffffff;
  --tf-text:#172033;
  --tf-text-muted:#64748b;
  --tf-text-disabled:#94a3b8;
  --tf-border:#e2e8f0;
  --tf-sidebar-text:#cbd5e1;

  /* Estatus: punto/indicador · texto · fondo suave */
  --tf-status-pending:#64748b;  --tf-status-pending-text:#475569;  --tf-status-pending-soft:#f1f5f9;
  --tf-status-progress:#f97360; --tf-status-progress-text:#c73e2e; --tf-status-progress-soft:#fff0ed;
  --tf-status-done:#16a34a;     --tf-status-done-text:#15803d;     --tf-status-done-soft:#ecfdf5;

  /* Semánticos */
  --tf-danger:#dc2626;  --tf-danger-text:#b91c1c;  --tf-danger-soft:#fef2f2;
  --tf-warning:#d97706; --tf-warning-text:#b45309; --tf-warning-soft:#fffbeb;
  --tf-info:#3b82f6;    --tf-info-text:#1d4ed8;    --tf-info-soft:#eff6ff;

  /* Prioridades (alta en ámbar: el naranja #F97316 es indistinguible del coral) */
  --tf-priority-low:#94a3b8;    --tf-priority-low-text:#475569;    --tf-priority-low-soft:#f1f5f9;
  --tf-priority-medium:#3b82f6; --tf-priority-medium-text:#1d4ed8; --tf-priority-medium-soft:#eff6ff;
  --tf-priority-high:#d97706;   --tf-priority-high-text:#b45309;   --tf-priority-high-soft:#fffbeb;
  --tf-priority-urgent:#dc2626; --tf-priority-urgent-text:#b91c1c; --tf-priority-urgent-soft:#fef2f2;

  /* Avatares: escala navy/pizarra, sin colores extra */
  --av1:#172554; --av2:#1e3a8a; --av3:#334155; --av4:#475569; --av5:#0f3f6e; --av6:#3b4a6b;

  /* Forma */
  --tf-radius-card:12px; --tf-radius-btn:9px; --tf-radius-modal:16px;
  --tf-shadow:0 1px 3px rgba(15,23,42,.06);
  --tf-shadow-float:0 8px 24px rgba(15,23,42,.10);
  --tf-veil:rgba(15,23,42,.45);

  /* Escaparate (no es parte de la app) */
  --esc-fondo:#e7eaf0; --esc-texto:#33404d; --esc-caja:#ffffff; --esc-linea:#d5d8de;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--esc-fondo);color:var(--tf-text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--tf-accent);outline-offset:2px}

/* ---------- escaparate (solo para presentar) ---------- */
.escaparate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12.5px;color:var(--esc-texto)}
.escaparate .grupo{display:flex;align-items:center;gap:4px;background:var(--esc-caja);border:1px solid var(--esc-linea);border-radius:10px;padding:4px 6px}
.escaparate .grupo b{font-weight:600;padding:0 4px}
.escaparate button{border:0;background:transparent;padding:4px 9px;border-radius:7px}
.escaparate button[aria-pressed="true"]{background:var(--tf-primary);color:var(--tf-surface)}
.escaparate input[type=date]{border:0;background:transparent;padding:2px 4px}
.escaparate .nota{opacity:.75}

/* ---------- marco ---------- */
.dispositivo{
  width:390px;height:800px;background:var(--tf-bg);border-radius:38px;overflow:hidden;position:relative;
  box-shadow:0 0 0 10px var(--tf-text),0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;
}
.dispositivo.computadora{width:min(1180px,100%);height:760px;border-radius:14px;box-shadow:0 0 0 1px var(--esc-linea),0 24px 60px rgba(0,0,0,.18);
  display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
.computadora .cuerpo{display:contents}
.computadora .nav-lateral{grid-column:1;grid-row:1 / 3}
.computadora .cabecera{grid-column:2;grid-row:1}
.computadora .contenido{grid-column:2;grid-row:2}
@media (max-width:520px){
  body{padding:0;background:var(--tf-bg)}
  .escaparate{display:none}
  .dispositivo,.dispositivo.computadora{width:100%;height:100vh;border-radius:0;box-shadow:none}
}

/* ---------- cabecera (blanca, como pide la guía) ---------- */
.cabecera{background:var(--tf-surface);color:var(--tf-text);border-bottom:1px solid var(--tf-border);padding:14px 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.computadora .cabecera{padding:14px 24px}
.cabecera .titulos{flex:1;min-width:0}
.cabecera h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cabecera .sub{font-size:12px;color:var(--tf-text-muted);margin-top:1px}
.btn-icono{border:0;background:transparent;color:var(--tf-primary);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.btn-icono:hover{background:var(--tf-bg)}
.sello{width:34px;height:34px;display:grid;place-items:center;color:var(--tf-logo)}
.sello svg{width:32px;height:auto}
.computadora .sello{display:none}

/* ---------- contenido ---------- */
.contenido{flex:1;overflow:auto;padding:14px 14px 90px}
.computadora .contenido{padding:20px 24px 24px}
.seccion-titulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tf-text-muted);margin:18px 4px 8px;font-weight:600}
.seccion-titulo:first-child{margin-top:4px}
.vacio{color:var(--tf-text-muted);text-align:center;padding:36px 16px;font-size:14px}

/* ---------- proyectos ---------- */
.lista-proyectos{display:grid;gap:10px}
.computadora .lista-proyectos{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.proyecto{background:var(--tf-surface);border-radius:var(--tf-radius-card);border:1px solid var(--tf-border);box-shadow:var(--tf-shadow);padding:14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;transition:border-color .12s,box-shadow .12s}
.proyecto:hover{border-color:color-mix(in srgb,var(--tf-primary) 30%,var(--tf-border));box-shadow:var(--tf-shadow-float)}
.proyecto .fila{display:flex;align-items:center;gap:8px}
.proyecto h3{margin:0;font-size:15.5px;flex:1;font-weight:650}
.proyecto .conteos{display:flex;gap:6px;flex-wrap:wrap}
.proyecto .progreso{height:4px;border-radius:99px;background:var(--tf-status-pending-soft);overflow:hidden;display:flex}
.proyecto .progreso i{display:block;height:100%}
.etiqueta-rol{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--tf-primary-soft);color:var(--tf-primary);font-weight:600}

/* ---------- chips / badges: punto de color, texto oscuro, fondo suave ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:9999px;white-space:nowrap;line-height:1.3}
.punto{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.chip.pendiente{background:var(--tf-status-pending-soft);color:var(--tf-status-pending-text)}
.chip.pendiente .punto{background:var(--tf-status-pending)}
.chip.en_curso{background:var(--tf-status-progress-soft);color:var(--tf-status-progress-text)}
.chip.en_curso .punto{background:var(--tf-status-progress)}
.chip.finalizada{background:var(--tf-status-done-soft);color:var(--tf-status-done-text)}
.chip.finalizada .punto{background:var(--tf-status-done)}
.chip.vencida{background:var(--tf-danger-soft);color:var(--tf-danger-text)}
.chip.por-vencer{background:var(--tf-warning-soft);color:var(--tf-warning-text)}
.chip.fecha{background:var(--tf-bg);color:var(--tf-text-muted);font-weight:500}
.chip.prio-baja{background:var(--tf-priority-low-soft);color:var(--tf-priority-low-text)}
.chip.prio-baja .punto{background:var(--tf-priority-low)}
.chip.prio-media{background:var(--tf-priority-medium-soft);color:var(--tf-priority-medium-text)}
.chip.prio-media .punto{background:var(--tf-priority-medium)}
.chip.prio-alta{background:var(--tf-priority-high-soft);color:var(--tf-priority-high-text)}
.chip.prio-alta .punto{background:var(--tf-priority-high)}
.chip.prio-urgente{background:var(--tf-priority-urgent-soft);color:var(--tf-priority-urgent-text)}
.chip.prio-urgente .punto{background:var(--tf-priority-urgent)}

/* ---------- avatares ---------- */
.avatares{display:flex}
.avatar{width:26px;height:26px;border-radius:50%;color:var(--tf-surface);font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--tf-surface);margin-left:-7px;letter-spacing:.02em}
.avatares .avatar:first-child{margin-left:0}
.avatar.grande{width:36px;height:36px;font-size:12.5px;margin:0;border:0}
.avatar.mas{background:var(--tf-border);color:var(--tf-text-muted)}

/* ---------- tablero ---------- */
.segmentos{display:flex;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:12px;padding:4px;gap:4px;position:sticky;top:-14px;z-index:2;margin-bottom:12px}
.segmentos button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--tf-text-muted);display:flex;justify-content:center;align-items:center;gap:6px}
.segmentos button .punto{opacity:.9}
.segmentos button.pendiente .punto{background:var(--tf-status-pending)}
.segmentos button.en_curso .punto{background:var(--tf-status-progress)}
.segmentos button.finalizada .punto{background:var(--tf-status-done)}
.segmentos button[aria-pressed="true"].pendiente{background:var(--tf-status-pending-soft);color:var(--tf-status-pending-text)}
.segmentos button[aria-pressed="true"].en_curso{background:var(--tf-status-progress-soft);color:var(--tf-status-progress-text)}
.segmentos button[aria-pressed="true"].finalizada{background:var(--tf-status-done-soft);color:var(--tf-status-done-text)}
.segmentos .num{font-size:11.5px;opacity:.85}
.filtros{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:13px;color:var(--tf-text-muted)}
.interruptor{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--tf-text-muted);padding:4px}
.interruptor .pista{width:32px;height:18px;border-radius:99px;background:var(--tf-border);position:relative;transition:.15s}
.interruptor .pista::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tf-surface);transition:.15s;box-shadow:var(--tf-shadow)}
.interruptor[aria-pressed="true"] .pista{background:var(--tf-accent)}
.interruptor[aria-pressed="true"] .pista::after{left:16px}
.columnas{display:grid;gap:10px}
.computadora .columnas{grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.columna{display:flex;flex-direction:column;gap:10px}
/* Columnas sin fondo de color: se distinguen por título, punto, contador y una línea fina. */
.columna-cab{display:none;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:2px 2px 8px;border-bottom:2px solid var(--tf-border);margin-bottom:2px}
.columna-cab .punto{width:8px;height:8px}
.columna-cab.pendiente{border-bottom-color:var(--tf-status-pending)} .columna-cab.pendiente .punto{background:var(--tf-status-pending)}
.columna-cab.en_curso{border-bottom-color:var(--tf-status-progress)} .columna-cab.en_curso .punto{background:var(--tf-status-progress)}
.columna-cab.finalizada{border-bottom-color:var(--tf-status-done)} .columna-cab.finalizada .punto{background:var(--tf-status-done)}
.computadora .columna-cab{display:flex}
.columna-cab .num{margin-left:auto;color:var(--tf-text-muted);font-weight:600;font-size:12px;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:99px;padding:1px 8px;letter-spacing:0}
.computadora .segmentos{display:none}

.tarjeta{position:relative;background:var(--tf-surface);border-radius:var(--tf-radius-card);border:1px solid var(--tf-border);box-shadow:var(--tf-shadow);padding:12px 13px;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:border-color .12s,box-shadow .12s,transform .12s}
.tarjeta:hover{border-color:color-mix(in srgb,var(--tf-primary) 28%,var(--tf-border));box-shadow:var(--tf-shadow-float)}
.tarjeta:active{transform:scale(.995)}
/* Urgente: indicador lateral; la tarjeta sigue blanca. */
.tarjeta.urgente::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tf-priority-urgent)}
.tarjeta h4{margin:0;font-size:14.5px;font-weight:650;line-height:1.3;letter-spacing:-.005em}
.tarjeta p{margin:0;font-size:13px;color:var(--tf-text-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarjeta .etiquetas{display:flex;gap:5px;flex-wrap:wrap}
.tarjeta .pie{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tarjeta .pie .avatares{margin-left:auto}
.tarjeta .proyecto-de{font-size:11.5px;color:var(--tf-primary);font-weight:600}
.tarjeta.terminada h4{color:var(--tf-text-muted);text-decoration:line-through;text-decoration-color:var(--tf-border)}

/* ---------- botones ---------- */
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:16px;border:0;background:var(--tf-accent);color:var(--tf-on-accent);display:grid;place-items:center;box-shadow:var(--tf-shadow-float);transition:background .12s,transform .12s}
.fab:hover{background:var(--tf-accent-hover)}
.fab:active{transform:scale(.96)}
.computadora .fab,.fab[hidden]{display:none}
.btn{border:0;border-radius:var(--tf-radius-btn);padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,box-shadow .12s}
.btn-primario{background:var(--tf-accent);color:var(--tf-on-accent)}
.btn-primario:hover{background:var(--tf-accent-hover)}
.btn-secundario{background:var(--tf-surface);color:var(--tf-text);box-shadow:inset 0 0 0 1px var(--tf-border)}
.btn-secundario:hover{background:var(--tf-bg)}
.btn-peligro{background:var(--tf-surface);color:var(--tf-danger-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tf-danger) 45%,var(--tf-border))}
.btn-peligro:hover{background:var(--tf-danger-soft)}
.btn-peligro-lleno{background:var(--tf-danger-text);color:var(--tf-surface)}
.btn-chico{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-bloque{width:100%}
.acciones-cab{display:none;gap:8px}
.computadora .acciones-cab{display:flex}

/* ---------- navegación ---------- */
.nav-inferior{position:absolute;left:0;right:0;bottom:0;background:var(--tf-surface);border-top:1px solid var(--tf-border);display:flex;justify-content:space-around;padding:6px 6px 14px}
.nav-inferior button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tf-text-muted);padding:6px 12px;border-radius:10px;min-width:84px}
.nav-inferior button[aria-current="page"]{color:var(--tf-primary);font-weight:650}
.nav-inferior button[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--tf-accent);transform:translateX(-50%)}
.nav-lateral{display:none}
.computadora .nav-inferior{display:none}
.cuerpo{display:flex;flex-direction:column;flex:1;min-height:0}
.computadora .nav-lateral{display:flex;flex-direction:column;gap:2px;background:var(--tf-primary);padding:18px 12px}
.marca-lateral{display:flex;align-items:center;gap:10px;color:var(--tf-surface);padding:2px 8px 18px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.marca-lateral svg{width:30px;height:auto}
.nav-lateral .separador{height:1px;background:rgba(255,255,255,.12);margin:10px 8px}
.nav-lateral .rotulo-nav{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tf-sidebar-text);opacity:.7;padding:4px 12px}
.nav-lateral button{position:relative;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--tf-sidebar-text);text-align:left}
.nav-lateral button:hover{background:rgba(255,255,255,.06);color:var(--tf-surface)}
.nav-lateral button[aria-current="page"]{background:rgba(249,115,96,.14);color:var(--tf-surface);font-weight:600}
.nav-lateral button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--tf-accent)}

/* ---------- hoja (detalle / formularios) ---------- */
.velo{position:absolute;inset:0;background:var(--tf-veil);display:flex;align-items:flex-end;z-index:10;animation:aparecer .15s}
.computadora .velo{align-items:stretch;justify-content:flex-end}
.hoja{background:var(--tf-surface);width:100%;max-height:92%;border-radius:var(--tf-radius-modal) var(--tf-radius-modal) 0 0;overflow:auto;padding:8px 18px 22px;animation:subir .18s ease-out}
.computadora .hoja{width:460px;max-height:none;border-radius:0;padding:22px 26px;animation:entrar .18s ease-out}
.asa{width:40px;height:5px;border-radius:9px;background:var(--tf-border);margin:4px auto 12px}
.computadora .asa{display:none}
.hoja-cab{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.hoja-cab h2{font-size:18px;margin:0;flex:1;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.hoja-cab .btn-icono{color:var(--tf-text-muted)}
.campo{margin-bottom:16px}
.campo>label,.campo>.etiqueta{display:block;font-size:11.5px;font-weight:600;color:var(--tf-text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.campo input[type=text],.campo input[type=email],.campo input[type=date],.campo textarea{width:100%;border:1px solid var(--tf-border);border-radius:var(--tf-radius-btn);padding:10px 12px;background:var(--tf-surface);font-size:14.5px;transition:border-color .12s,box-shadow .12s}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--tf-accent);box-shadow:0 0 0 3px var(--tf-accent-soft)}
.campo textarea{min-height:96px;resize:vertical}
.campo .ayuda{font-size:12px;color:var(--tf-text-muted);margin-top:5px}
.campo .error{font-size:12px;color:var(--tf-danger-text);margin-top:5px}
.texto-largo{font-size:14.5px;line-height:1.55;white-space:pre-wrap;margin:0}
.selector-estatus{display:flex;gap:6px}
.selector-estatus button{flex:1;border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:var(--tf-radius-btn);padding:9px 4px;font-size:13px;font-weight:600;color:var(--tf-text-muted);display:flex;align-items:center;justify-content:center;gap:6px}
.selector-estatus button.pendiente .punto{background:var(--tf-status-pending)}
.selector-estatus button.en_curso .punto{background:var(--tf-status-progress)}
.selector-estatus button.finalizada .punto{background:var(--tf-status-done)}
.selector-estatus button[aria-pressed="true"].pendiente{background:var(--tf-status-pending-soft);color:var(--tf-status-pending-text);border-color:var(--tf-status-pending)}
.selector-estatus button[aria-pressed="true"].en_curso{background:var(--tf-status-progress-soft);color:var(--tf-status-progress-text);border-color:var(--tf-status-progress)}
.selector-estatus button[aria-pressed="true"].finalizada{background:var(--tf-status-done-soft);color:var(--tf-status-done-text);border-color:var(--tf-status-done)}
.selector-estatus button:disabled{opacity:.5;cursor:not-allowed}
/* Prioridad en el formulario: cuatro opciones de radio con apariencia de botón. */
.elegir-prioridad{display:flex;gap:6px}
.elegir-prioridad label{flex:1;cursor:pointer}
.elegir-prioridad input{position:absolute;opacity:0;pointer-events:none}
.elegir-prioridad .chip{width:100%;justify-content:center;padding:8px 4px;font-size:12.5px;border:1px solid var(--tf-border);background:var(--tf-surface);color:var(--tf-text-muted)}
.elegir-prioridad input:checked + .chip.prio-baja{background:var(--tf-priority-low-soft);color:var(--tf-priority-low-text);border-color:var(--tf-priority-low)}
.elegir-prioridad input:checked + .chip.prio-media{background:var(--tf-priority-medium-soft);color:var(--tf-priority-medium-text);border-color:var(--tf-priority-medium)}
.elegir-prioridad input:checked + .chip.prio-alta{background:var(--tf-priority-high-soft);color:var(--tf-priority-high-text);border-color:var(--tf-priority-high)}
.elegir-prioridad input:checked + .chip.prio-urgente{background:var(--tf-priority-urgent-soft);color:var(--tf-priority-urgent-text);border-color:var(--tf-priority-urgent)}
.elegir-prioridad input:focus-visible + .chip{outline:2px solid var(--tf-accent)}
.personas{display:flex;flex-direction:column;gap:6px}
.persona{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px;flex-wrap:wrap}
.persona .nombre{flex:1;font-size:14px}
.persona .nombre small{display:block;color:var(--tf-text-muted);font-size:12px}
.persona input[type=checkbox]{width:18px;height:18px;accent-color:var(--tf-accent)}
label.persona{cursor:pointer}
label.persona:hover{background:var(--tf-bg)}

.chip.tipo{background:color-mix(in srgb,var(--tipo) 12%,var(--tf-surface));color:color-mix(in srgb,var(--tipo) 70%,var(--tf-text))}
.chip.tipo .punto{background:var(--tipo)}
.tipos-tarjeta{display:flex;gap:5px;flex-wrap:wrap}
.filtro-tipos{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.filtro-tipos button{border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--tf-text-muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.filtro-tipos button .punto{background:var(--tipo,var(--tf-text-muted))}
.filtro-tipos button[aria-pressed="true"]{border-color:var(--tipo,var(--tf-primary));background:color-mix(in srgb,var(--tipo,var(--tf-primary)) 10%,var(--tf-surface));color:var(--tf-text)}
.elegir-tipos{display:flex;gap:6px;flex-wrap:wrap}
.elegir-tipos label{cursor:pointer}
.elegir-tipos input{position:absolute;opacity:0;pointer-events:none}
.elegir-tipos .chip{border:1px solid transparent;padding:6px 12px;font-size:13px;opacity:.5}
.elegir-tipos input:checked + .chip{opacity:1;border-color:var(--tipo)}
.elegir-tipos input:focus-visible + .chip{outline:2px solid var(--tf-accent)}
.fila-tipo{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--tf-border)}
.fila-tipo:last-child{border-bottom:0}
.fila-tipo .nombre{flex:1;font-size:14px;min-width:0}
.fila-tipo .nombre small{display:block;color:var(--tf-text-muted);font-size:12px}
.muestra-color{width:28px;height:28px;border-radius:8px;background:var(--tipo);flex-shrink:0}
.muestras{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muestras button{width:30px;height:30px;border-radius:50%;border:2px solid var(--tf-surface);background:var(--tipo);box-shadow:0 0 0 1px var(--tf-border)}
.muestras button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tf-primary)}
.muestras input[type=color]{width:42px;height:34px;border:1px solid var(--tf-border);border-radius:8px;padding:2px;background:var(--tf-surface)}
.historial{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.historial li{position:relative;padding:0 0 14px 22px;font-size:13.5px;line-height:1.45}
.historial li::before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--tf-surface);border:2px solid var(--tf-text-muted)}
.historial li::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--tf-border)}
.historial li:last-child{padding-bottom:0}
.historial li:last-child::after{display:none}
.historial li.pendiente::before{border-color:var(--tf-status-pending)}
.historial li.en_curso::before{border-color:var(--tf-status-progress)}
.historial li.finalizada::before{border-color:var(--tf-status-done)}
.historial .cuando{display:block;font-size:12px;color:var(--tf-text-muted)}
.historial .flecha{color:var(--tf-text-muted);margin:0 2px}
.historial .chip{font-size:11px;padding:1px 8px}

.fila-botones{display:flex;gap:8px;margin-top:8px}

.permisos button,.permisos span{border:1px solid var(--tf-border);background:var(--tf-surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--tf-text-muted);display:inline-flex;gap:5px;align-items:center}
.permisos button svg{display:none}
.permisos button[aria-pressed="true"],.permisos span.si{background:var(--tf-accent-soft);border-color:var(--tf-accent);color:var(--tf-primary)}
.permisos button[aria-pressed="true"] svg,.permisos span.si svg{display:inline;color:var(--tf-accent-text)}
.permisos .rotulo{border:0;padding:4px 0;background:transparent;font-weight:500}
.banner{display:flex;gap:10px;align-items:center;background:var(--tf-status-pending-soft);color:var(--tf-text);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner span{flex:1}
.proyecto.archivado{opacity:.75}
.aviso{font-size:13px;color:var(--tf-text-muted);background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}

/* ---------- confirmación y toast ---------- */
.modal{position:absolute;inset:0;background:var(--tf-veil);display:grid;place-items:center;z-index:20;padding:24px;animation:aparecer .12s}
.modal .caja{background:var(--tf-surface);border-radius:var(--tf-radius-modal);padding:20px;max-width:340px;width:100%;box-shadow:var(--tf-shadow-float)}
.modal p{margin:0 0 16px;font-size:15px;line-height:1.45}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tf-primary);color:var(--tf-surface);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:30;box-shadow:var(--tf-shadow-float);white-space:nowrap;animation:aparecer .15s}
.computadora .toast{bottom:24px}

@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes entrar{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

--------------------------------------------------------------------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const iniciales = id => usuarios[id].nombre.split(' ').map(p => p[0]).slice(0,2).join('');
const avatar = (id, grande) => `<span class="avatar${grande ? ' grande' : ''}" style="background:var(${usuarios[id].color})" title="${esc(usuarios[id].nombre)}">${iniciales(id)}</span>`;
function avatares(ids, max = 3){
  const extra = ids.length - max;
  return `<span class="avatares">${ids.slice(0, max).map(i => avatar(i)).join('')}${extra > 0 ? `<span class="avatar mas">+${extra}</span>` : ''}</span>`;
}
const fechaDe = dias => { if (dias === null) return null; const d = new Date(estado.hoy); d.setDate(d.getDate() + dias); return d; };
const diasEntre = d => Math.round((new Date(d.toDateString()) - new Date(estado.hoy.toDateString())) / 864e5);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const corta = d => `${d.getDate()} ${MESES[d.getMonth()]}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function chipFecha(t){
  if (!t.fecha) return '';
  const dif = diasEntre(t.fecha);
  if (t.estatus !== 'finalizada' && dif < 0) return `<span class="chip vencida">${I.alerta} Vencida · ${corta(t.fecha)}</span>`;
  if (t.estatus !== 'finalizada' && dif === 0) return `<span class="chip por-vencer">${I.calendario} Vence hoy</span>`;
  if (t.estatus !== 'finalizada' && dif === 1) return `<span class="chip por-vencer">${I.calendario} Vence mañana</span>`;
  return `<span class="chip fecha">${I.calendario} ${corta(t.fecha)}</span>`;
}
const esVencida = t => t.fecha && t.estatus !== 'finalizada' && diasEntre(t.fecha) < 0;
const proyectoDe = id => proyectos.find(p => p.id === id);

/* Historial de estatus: cada cambio guarda cuándo (fecha y hora), quién, de qué estatus y a cuál.

function momento(dias, hora, minuto){ const d = fechaDe(dias); d.setHours(hora, minuto, 0, 0); return d; }
tarjetas.forEach(t => {

/* ---------------------------------------------------------------------------
   Eventos (un solo listener delegado, como en la app real)
--------------------------------------------------------------------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vista],[data-yo],[data-ir],[data-proyecto],[data-tab],[data-tarjeta],[data-estatus],[data-permiso],[data-filtro-tipo],[data-color],[data-accion],#fab');
  if (!b) return;
  if (b.dataset.vista){ estado.vista = b.dataset.vista; marcar('[data-vista]', b); return render(); }
  if (b.dataset.yo){
    estado.yo = b.dataset.yo; marcar('[data-yo]', b);
    if (estado.proyecto && !proyectoDe(estado.proyecto).miembros.includes(estado.yo)) estado.pantalla = 'proyectos';
    estado.capa = null; return render();
  }
  if (b.dataset.ir){ estado.pantalla = b.dataset.ir; estado.capa = null; return render(); }
  if (b.dataset.proyecto){ estado.proyecto = +b.dataset.proyecto; estado.pantalla = 'tablero'; estado.tab = 'pendiente'; estado.soloMias = false; estado.filtroTipo = null; return render(); }
  if (b.dataset.tab){ estado.tab = b.dataset.tab; return render(); }
  if (b.dataset.tarjeta){ estado.capa = {tipo:'detalle', id:+b.dataset.tarjeta}; return render(); }
  if (b.dataset.filtroTipo !== undefined){ estado.filtroTipo = +b.dataset.filtroTipo || null; return render(); }
  if (b.dataset.color){ $('#f-tcolor').value = b.dataset.color; vistaTipo(); return; }
  if (b.dataset.permiso){
    const [u, k] = b.dataset.permiso.split(':'); const p = proyectoDe(estado.proyecto);
    p.permisos[u] = p.permisos[u] || {}; p.permisos[u][k] = !p.permisos[u][k];
    toast(`Permiso actualizado para ${usuarios[u].nombre}.`); return render();
  }
  if (b.dataset.estatus){
    const t = tarjetas.find(x => x.id === estado.capa.id);
    if (!puede(proyectoDe(t.proyecto), 'estatus')) return;
    if (t.estatus !== b.dataset.estatus){ t.historial.push({cuando:ahora(), quien:estado.yo, de:t.estatus, a:b.dataset.estatus}); t.estatus = b.dataset.estatus; toast(`Tarjeta movida a ${ESTATUS.find(x => x[0] === t.estatus)[1]}.`); }
    return render();
  }
  if (b.id === 'fab'){ estado.capa = {tipo:'nueva'}; return render(); }
  const a = b.dataset.accion;
  if (a === 'cerrar-fondo' && e.target !== b) return;   // clic dentro de la hoja
  if (a === 'cerrar' || a === 'cerrar-fondo'){ estado.capa = estado.capa && estado.capa.volver ? estado.capa.volver : null; return render(); }
  if (a === 'nueva'){ estado.capa = {tipo:'nueva'}; return render(); }
  if (a === 'nuevo-proyecto'){ estado.capa = {tipo:'nuevo-proyecto'}; return render(); }
  if (a === 'editar'){ estado.capa = {tipo:'editar', id:estado.capa.id}; return render(); }
  if (a === 'nuevo-tipo'){ estado.capa = {tipo:'tipo', id:null}; return render(); }
  if (a === 'editar-tipo'){ estado.capa = {tipo:'tipo', id:+b.dataset.tipo}; return render(); }
  if (a === 'reenviar'){ toast(`Se reenvió la invitación a ${b.dataset.correo}.`); return; }
  if (a === 'restaurar'){ proyectoDe(estado.proyecto).archivado = false; toast('Proyecto restaurado.'); return render(); }
  if (a === 'solo-mias'){ estado.soloMias = !estado.soloMias; return render(); }
  if (a === 'invitar'){
    const inp = $('#correo-inv'); const v = inp.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ inp.focus(); return toast('Escribe un correo válido.'); }
    const p = proyectoDe(estado.proyecto);
    if (p.invitaciones.includes(v) || p.miembros.some(u => usuarios[u].correo === v)) return toast('Esa persona ya está invitada o es miembro.');
    p.invitaciones.push(v); toast('Se envió la invitación.'); return render();
  }
  if (a === 'confirmar'){ const c = estado.capa; estado.capa = null; c.hacer(); return render(); }
});

/* Formularios destructivos: data-confirmar abre el modal (nunca window.confirm). */
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.confirmar){
    const p = proyectoDe(estado.proyecto);
    const volver = estado.capa;
    let hacer, boton = f.querySelector('button').textContent.trim();
    if (f.dataset.eliminar){ hacer = () => { tarjetas.splice(tarjetas.findIndex(t => t.id === +f.dataset.eliminar), 1); toast('Tarjeta eliminada.'); }; }
    if (f.dataset.eliminarTipo){ hacer = () => { const id = +f.dataset.eliminarTipo; p.tipos = p.tipos.filter(x => x.id !== id); tarjetas.forEach(t => t.tipos = t.tipos.filter(x => x !== id)); if (estado.filtroTipo === id) estado.filtroTipo = null; toast('Tipo eliminado.'); }; }
    if (f.dataset.transferir){ hacer = () => { const u = f.dataset.transferir; const antes = p.dueno; p.dueno = u; delete p.permisos[u]; p.permisos[antes] = {crear:true, editar:true, estatus:true, eliminar:true, tipos:true}; toast(`${usuarios[u].nombre} es el nuevo dueño.`); }; }
    if (f.dataset.archivar){ hacer = () => { p.archivado = true; estado.pantalla = 'tablero'; toast('Proyecto archivado.'); }; }
    if (f.dataset.eliminarProyecto){ hacer = () => { for (let i = tarjetas.length - 1; i >= 0; i--) if (tarjetas[i].proyecto === p.id) tarjetas.splice(i, 1); proyectos.splice(proyectos.indexOf(p), 1); estado.pantalla = 'proyectos'; estado.proyecto = null; toast('Proyecto eliminado.'); }; }
    if (f.dataset.quitar){ hacer = () => { const u = f.dataset.quitar; delete p.permisos[u]; p.miembros = p.miembros.filter(x => x !== u); tarjetas.filter(t => t.proyecto === p.id).forEach(t => t.asignados = t.asignados.filter(x => x !== u)); toast('Se quitó a la persona del proyecto.'); }; }
    if (f.dataset.cancelar){ hacer = () => { p.invitaciones = p.invitaciones.filter(x => x !== f.dataset.cancelar); toast('Invitación cancelada.'); }; }
    if (f.dataset.salir){ hacer = () => { p.miembros = p.miembros.filter(x => x !== estado.yo); tarjetas.filter(t => t.proyecto === p.id).forEach(t => t.asignados = t.asignados.filter(x => x !== estado.yo)); estado.pantalla = 'proyectos'; toast('Saliste del proyecto.'); }; }
    estado.capa = {tipo:'confirmar', mensaje:f.dataset.confirmar, boton, hacer, volver:f.dataset.eliminar ? volver : null};
    return render();
  }
  if (f.id === 'form-tarjeta'){
    const titulo = $('#f-titulo').value.trim(), desc = $('#f-desc').value.trim();
    const asig = [...f.querySelectorAll('[name=asig]:checked')].map(x => x.value);
    const tiposSel = [...f.querySelectorAll('[name=tipo]:checked')].map(x => +x.value);
    const prioridad = f.querySelector('[name=prioridad]:checked').value;
    $('#e-titulo').hidden = !!titulo; $('#e-desc').hidden = !!desc;
    if (!titulo || !desc) return;
    const fv = $('#f-fecha').value; const fecha = fv ? new Date(fv + 'T12:00:00') : null;
    if (estado.capa.tipo === 'editar'){
      const t = tarjetas.find(x => x.id === estado.capa.id);
      Object.assign(t, {titulo, descripcion:desc, prioridad, fecha, asignados:asig, tipos:tiposSel});
      estado.capa = {tipo:'detalle', id:t.id}; toast('Tarjeta guardada.');
    } else {
      tarjetas.push({id:sigId++, proyecto:estado.proyecto, titulo, descripcion:desc, estatus:'pendiente', prioridad, fecha, asignados:asig, tipos:tiposSel, creada_por:estado.yo, historial:[{cuando:ahora(), quien:estado.yo, de:null, a:'pendiente'}]});
      estado.capa = null; estado.tab = 'pendiente'; toast('Tarjeta creada.');
    }
    return render();
  }
  if (f.id === 'form-tipo'){
    const p = proyectoDe(estado.proyecto);
    const nombre = $('#f-tnombre').value.trim(), descripcion = $('#f-tdesc').value.trim(), color = $('#f-tcolor').value.toLowerCase();
    const err = $('#e-tnombre');
    const repetido = p.tipos.some(x => x.nombre.toLowerCase() === nombre.toLowerCase() && x.id !== estado.capa.id);
    err.textContent = !nombre ? 'Escribe un nombre.' : repetido ? 'Ya hay un tipo con ese nombre en este proyecto.' : '';
    err.hidden = !err.textContent; if (err.textContent) return;
    if (!/^#[0-9a-f]{6}$/.test(color)) return;
    if (estado.capa.id) Object.assign(tipoDe(p, estado.capa.id), {nombre, descripcion, color});
    else p.tipos.push({id:sigTipo++, nombre, descripcion, color});
    toast(estado.capa.id ? 'Tipo guardado.' : 'Tipo creado.'); estado.capa = null; return render();
  }
  if (f.id === 'form-proyecto'){
    const nombre = $('#f-nombre').value.trim();
    $('#e-nombre').hidden = !!nombre; if (!nombre) return;
    const id = Math.max(...proyectos.map(p => p.id)) + 1;
    proyectos.push({id, nombre, dueno:estado.yo, miembros:[estado.yo], invitaciones:[], archivado:false, permisos:{}, tipos:[]});
    estado.capa = null; estado.proyecto = id; estado.pantalla = 'tablero'; toast('Proyecto creado.');
    return render();
  }
});

$('#hoy').addEventListener('change', e => {
  if (!e.target.value) return;
  const nuevo = new Date(e.target.value + 'T12:00:00');
  // Las fechas fin se quedan fijas: solo cambia el «hoy» contra el que se comparan.
  estado.hoy = nuevo; render();
});

function vistaTipo(){
  const c = $('#f-tcolor'); if (!c) return;
  document.querySelectorAll('[data-color]').forEach(x => x.setAttribute('aria-pressed', x.dataset.color === c.value.toLowerCase()));
  $('#vista-tipo').innerHTML = chipTipo({nombre: $('#f-tnombre').value.trim() || 'Nombre del tipo', descripcion:'', color:c.value});
}
document.addEventListener('input', e => { if (['f-tcolor','f-tnombre'].includes(e.target.id)) vistaTipo(); });

function marcar(sel, b){ document.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', x === b)); }

render();
</script>
</body>
